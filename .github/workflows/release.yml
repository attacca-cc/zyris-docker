name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 22.04, not 24.04, for the glibc floor: a glibc-linked binary runs on the glibc it was built
  # against or newer, never older. 22.04 ships glibc 2.35, which covers Debian 12 and Ubuntu
  # 22.04 upward.
  linux-x86_64:
    name: Linux x86_64 binary
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build (release)
        run: cargo build --release
      - name: smoke test
        run: ./target/release/zyris-docker --help >/dev/null 2>&1 || test $? -ne 127
      - name: package (tarball)
        run: |
          mkdir -p dist
          tar czf dist/zyris-docker-x86_64-linux.tar.gz -C target/release zyris-docker
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*

  container-image:
    name: build + push GHCR image
    runs-on: ubuntu-24.04
    needs: linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: create GitHub release
    needs: [linux-x86_64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          set -e
          cp Dockerfile README.md dist/
          (cd dist && sha256sum -- *) > SHA256SUMS
          mv SHA256SUMS dist/
          ls -la dist
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
            TAG="v${VERSION}"
          fi
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/* \
            --title "zyris-docker $TAG" \
            --notes "Container node release. Pull the image: \`docker pull ghcr.io/${{ github.repository }}:$TAG\` — see the README for usage."
